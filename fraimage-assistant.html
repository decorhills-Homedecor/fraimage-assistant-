<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Fraimage Product Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --cream:#F7F3EE;--parchment:#EDE6DA;--gold:#B8955A;--gold-d:#8B6A35;
  --dark:#2A2118;--mid:#6B5D4F;--muted:#A8998A;--white:#FDFAF7;
}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:var(--cream);}

/* ── LAYOUT ── */
.app{
  display:flex;flex-direction:column;height:100vh;max-width:520px;
  margin:0 auto;background:var(--white);
  box-shadow:0 0 40px rgba(42,33,24,.12);
}

/* ── HEADER ── */
.hd{
  background:linear-gradient(135deg,#241C12,#3A2A1A);
  padding:16px 18px;flex-shrink:0;
}
.hd-row{display:flex;align-items:center;gap:12px;margin-bottom:4px;}
.hd-av{
  width:40px;height:40px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,var(--gold),var(--gold-d));
  display:flex;align-items:center;justify-content:center;
}
.hd-av svg{width:22px;height:22px;fill:white;}
.hd-title{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:600;color:var(--cream);}
.hd-status{font-size:11px;color:var(--gold);font-weight:300;letter-spacing:.04em;}
.hd-sub{font-size:12px;color:rgba(247,243,238,.45);font-weight:300;margin-top:2px;}

/* ── SETUP BAR ── */
#setup-bar{
  background:#fff8ee;border-bottom:2px solid var(--gold);
  padding:12px 16px;flex-shrink:0;display:none;
}
#setup-bar.on{display:block;}
.setup-label{font-size:11px;font-weight:500;color:var(--gold-d);margin-bottom:7px;letter-spacing:.03em;}
.setup-row{display:flex;gap:8px;}
#api-input{
  flex:1;border:1px solid rgba(184,149,90,.4);border-radius:8px;padding:8px 10px;
  font-family:'DM Sans',sans-serif;font-size:13px;color:var(--dark);background:var(--white);outline:none;
}
#api-input:focus{border-color:var(--gold);}
#api-save{
  background:var(--gold);color:white;border:none;border-radius:8px;
  padding:8px 18px;font-size:13px;font-family:'DM Sans',sans-serif;font-weight:500;cursor:pointer;
}
#api-save:hover{background:var(--gold-d);}

/* ── COLOR FILTERS ── */
.filters{
  padding:10px 14px;border-bottom:1px solid var(--parchment);
  overflow-x:auto;white-space:nowrap;flex-shrink:0;
}
.filters::-webkit-scrollbar{height:0;}
.fc{
  display:inline-block;border:1px solid rgba(184,149,90,.35);color:var(--mid);
  background:transparent;border-radius:20px;padding:5px 13px;font-size:12px;
  font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .18s;margin-right:6px;
}
.fc:hover,.fc.on{background:var(--gold);color:white;border-color:var(--gold);}

/* ── MESSAGES ── */
#msgs{
  flex:1;overflow-y:auto;padding:16px 14px;
  display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth;
}
#msgs::-webkit-scrollbar{width:4px;}
#msgs::-webkit-scrollbar-thumb{background:var(--parchment);border-radius:2px;}

.msg{display:flex;gap:9px;animation:in .28s ease both;}
@keyframes in{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.msg.user{flex-direction:row-reverse;}
.av{
  width:30px;height:30px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;
}
.msg.bot .av{background:var(--parchment);color:var(--gold);}
.msg.user .av{background:var(--gold);color:white;}
.bub{
  max-width:82%;padding:10px 14px;border-radius:14px;
  font-size:13.5px;line-height:1.58;color:var(--dark);
}
.msg.bot .bub{background:var(--cream);border-bottom-left-radius:4px;}
.msg.user .bub{background:linear-gradient(135deg,var(--gold),var(--gold-d));color:white;border-bottom-right-radius:4px;}

/* quick chips */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;}
.chip{
  border:1px solid rgba(184,149,90,.4);color:var(--gold);background:transparent;
  border-radius:20px;padding:5px 13px;font-size:12px;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .18s;
}
.chip:hover{background:var(--gold);color:white;}

/* product card */
.pcard{background:white;border:1px solid var(--parchment);border-radius:10px;overflow:hidden;margin-top:10px;}
.pcard img{width:100%;height:110px;object-fit:cover;display:block;background:var(--parchment);}
.pcard-body{padding:9px 12px;}
.pcard-color{font-size:12px;font-weight:500;color:var(--gold);margin-bottom:2px;}
.pcard-detail{font-size:12px;color:var(--mid);line-height:1.4;}
.pcard-sku{
  display:inline-block;background:var(--parchment);color:var(--mid);
  font-size:10px;font-weight:500;letter-spacing:.06em;padding:2px 8px;
  border-radius:4px;margin-top:5px;font-family:monospace;
}

/* typing */
.dots{display:flex;gap:4px;align-items:center;padding:3px 0;}
.dots span{width:7px;height:7px;border-radius:50%;background:var(--gold);animation:bounce 1.2s infinite ease-in-out;}
.dots span:nth-child(2){animation-delay:.2s;}
.dots span:nth-child(3){animation-delay:.4s;}
@keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.4;}40%{transform:translateY(-5px);opacity:1;}}
.upimg{max-width:100%;border-radius:9px;margin-bottom:6px;display:block;}

/* ── INPUT ── */
.inp-area{padding:10px 12px 14px;border-top:1px solid var(--parchment);background:var(--white);flex-shrink:0;}
#prev-row{display:none;align-items:center;gap:8px;margin-bottom:8px;padding:6px 9px;background:var(--cream);border-radius:8px;}
#prev-row.on{display:flex;}
#prev-thumb{width:36px;height:36px;border-radius:6px;object-fit:cover;}
#prev-name{font-size:11px;color:var(--mid);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#prev-rm{background:none;border:none;cursor:pointer;color:var(--muted);font-size:20px;line-height:1;padding:0 2px;}
.inp-row{
  display:flex;align-items:flex-end;gap:8px;
  background:var(--cream);border:1.5px solid rgba(184,149,90,.25);
  border-radius:12px;padding:8px 10px 8px 14px;transition:border-color .2s;
}
.inp-row:focus-within{border-color:var(--gold);}
#txt{
  flex:1;border:none;background:transparent;font-family:'DM Sans',sans-serif;
  font-size:14px;color:var(--dark);outline:none;resize:none;
  min-height:22px;max-height:90px;line-height:1.5;
}
#txt::placeholder{color:var(--muted);}
.ibtn{background:none;border:none;cursor:pointer;padding:4px;color:var(--muted);transition:color .18s;display:flex;align-items:center;}
.ibtn:hover{color:var(--gold);}
.ibtn svg{width:20px;height:20px;}
#sbtn{
  background:linear-gradient(135deg,var(--gold),var(--gold-d));border:none;cursor:pointer;
  width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:opacity .2s,transform .15s;
}
#sbtn:hover{opacity:.88;transform:scale(1.06);}
#sbtn svg{width:16px;height:16px;fill:white;}
#fin{display:none;}
</style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <div class="hd">
    <div class="hd-row">
      <div class="hd-av"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg></div>
      <div>
        <div class="hd-title">Fraimage Product Assistant</div>
        <div class="hd-status">&#9679; Online &middot; 476 frame mouldings</div>
      </div>
    </div>
    <div class="hd-sub">Ask about colors, finishes &amp; SKU codes &mdash; or upload a photo</div>
  </div>

  <!-- API Key Setup -->
  <div id="setup-bar">
    <div class="setup-label">&#128273; Enter your Anthropic API Key to activate the assistant</div>
    <div class="setup-row">
      <input id="api-input" type="password" placeholder="sk-ant-api03-..."/>
      <button id="api-save" onclick="saveKey()">Activate</button>
    </div>
  </div>

  <!-- Color Filters -->
  <div class="filters">
    <button class="fc on" onclick="fc('All',this)">All</button>
    <button class="fc" onclick="fc('Black',this)">Black</button>
    <button class="fc" onclick="fc('Gold',this)">Gold</button>
    <button class="fc" onclick="fc('Silver',this)">Silver</button>
    <button class="fc" onclick="fc('White',this)">White</button>
    <button class="fc" onclick="fc('Walnut',this)">Walnut</button>
    <button class="fc" onclick="fc('Oak',this)">Oak</button>
    <button class="fc" onclick="fc('Bronze',this)">Bronze</button>
    <button class="fc" onclick="fc('Champagne',this)">Champagne</button>
    <button class="fc" onclick="fc('Rose Gold',this)">Rose Gold</button>
    <button class="fc" onclick="fc('Mahogany',this)">Mahogany</button>
  </div>

  <!-- Messages -->
  <div id="msgs"></div>

  <!-- Input -->
  <div class="inp-area">
    <div id="prev-row">
      <img id="prev-thumb" src="" alt=""/>
      <span id="prev-name">photo.jpg</span>
      <button id="prev-rm" onclick="rmImg()">&#215;</button>
    </div>
    <div class="inp-row">
      <textarea id="txt" rows="1" placeholder="Ask about colors, finishes, sizes..." onkeydown="onKey(event)" oninput="resize(this)"></textarea>
      <label class="ibtn" title="Upload a photo">
        <input type="file" id="fin" accept="image/*" onchange="onFile(event)"/>
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
      </label>
      <button id="sbtn" onclick="send()">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>

</div>

en\nSKU:068-283 | Color:White | Finish:Matte | Clean white\nSKU:068-3030 | Color:Gold | Finish:Glossy | Polished gold\nSKU:068-4245 | Color:Silver | Finish:Matte | Brushed silver\nSKU:068-468 | Color:Silver | Finish:Glossy | Brushed silver with white overlay\nSKU:068-x-1507 | Color:Rate Limited | Finish: | HTTP 429\nSKU:068-X-938 | Color:Rate Limited | Finish: | HTTP 429\nSKU:068-X-941 | Color:Rate Limited | Finish: | HTTP 429\nSKU:10403-L67G\" | Color:Rate Limited | Finish: | HTTP 429\nSKU:10403-U56H\" | Color:Rate Limited | Finish: | HTTP 429\nSKU:1819-6-207 | Color:Rate Limited | Finish: | HTTP 429\nSKU:1988-197 | Color:Rate Limited | Finish: | HTTP 429\nSKU:1988-283 | Color:Rate Limited | Finish: | HTTP 429\nSKU:1988-388-GOLD | Color:Rate Limited | Finish: | HTTP 429";
var SYSTEM = "You are a product assistant for Fraimage Novelties / Decorhills Home Decor, a UAE wholesaler of picture frame mouldings. You have 476 products. CATALOG (SKU|Color|Finish|Detail):\n" + CATALOG_TEXT + "\n\nRULES: Only recommend products from the catalog. List up to 4 matches. For each write: **SKU: [sku]** - [Color], [Finish] - [detail]. If customer uploads a photo, describe the style and find closest matches. Be friendly and concise. For pricing or ordering, ask them to contact the sales team.";
var img64 = null;
var hist = [];
var CHIPS = ["What black frames do you have?","Show me gold matte frames","Do you have wood grain finishes?","Which frames come in silver?"];

window.onload = function() {
  var k = localStorage.getItem('fi_key');
  if (!k) document.getElementById('setup-bar').classList.add('on');
  else document.getElementById('api-input').value = k;
  welcome();
};

function welcome() {
  var chips = CHIPS.map(function(c){
    return '<button class="chip" onclick="quickSend(this)">' + c + '</button>';
  }).join('');
  bot('Hello! I am your Fraimage product assistant.<br><br>I have all <strong>476 frame mouldings</strong> loaded. Ask me about colors, finishes, or SKU codes. You can also <strong>upload a photo</strong> of a frame you like and I will find the closest match.<div class="chips">' + chips + '</div>');
}

function saveKey() {
  var k = document.getElementById('api-input').value.trim();
  if (!k) return;
  localStorage.setItem('fi_key', k);
  document.getElementById('setup-bar').classList.remove('on');
  bot('API key saved! I am ready to help. What would you like to know about our frames?');
}

function fc(color, btn) {
  document.querySelectorAll('.fc').forEach(function(b){ b.classList.remove('on'); });
  btn.classList.add('on');
  var n = color === 'All' ? CATALOG.length : CATALOG.filter(function(p){ return p.color === color; }).length;
  bot('Showing <strong>' + n + ' products</strong> in <strong>' + (color === 'All' ? 'all colors' : color) + '</strong>. What would you like to know?');
}

function onFile(e) {
  var file = e.target.files[0]; if (!file) return;
  var r = new FileReader();
  r.onload = function(ev) {
    img64 = ev.target.result.split(',')[1];
    document.getElementById('prev-thumb').src = ev.target.result;
    document.getElementById('prev-name').textContent = file.name;
    document.getElementById('prev-row').classList.add('on');
  };
  r.readAsDataURL(file);
}

function rmImg() {
  img64 = null;
  document.getElementById('prev-row').classList.remove('on');
  document.getElementById('fin').value = '';
}

function quickSend(btn) {
  document.getElementById('txt').value = btn.textContent;
  send();
}

function onKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } }
function resize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 90) + 'px'; }

function send() {
  var el = document.getElementById('txt');
  var text = el.value.trim();
  if (!text && !img64) return;

  var key = localStorage.getItem('fi_key') || document.getElementById('api-input').value.trim();
  if (!key) { document.getElementById('setup-bar').classList.add('on'); return; }

  var content = [];
  if (img64) {
    userMsg(text, img64);
    content.push({ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: img64 } });
  } else {
    userMsg(text, null);
  }
  if (text) content.push({ type: 'text', text: text });

  el.value = ''; el.style.height = 'auto'; rmImg();
  hist.push({ role: 'user', content: content });

  var tid = typing();

  fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': key,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-calls': 'true'
    },
    body: JSON.stringify({ model: 'claude-sonnet-4-20250514', max_tokens: 1000, system: SYSTEM, messages: hist })
  })
  .then(function(r) {
    rmTyping(tid);
    if (!r.ok) return r.json().then(function(e){ throw new Error(e.error ? e.error.message : 'Error ' + r.status); });
    return r.json();
  })
  .then(function(d) {
    var reply = (d.content||[]).map(function(b){ return b.text||''; }).join('');
    hist.push({ role: 'assistant', content: reply });
    botWithCards(reply);
  })
  .catch(function(err) { rmTyping(tid); bot('Error: ' + err.message); });
}

function botWithCards(text) {
  var re = /SKU:\s*([A-Za-z0-9\-]+)/g, m, skus = [];
  while ((m = re.exec(text)) !== null) skus.push(m[1]);
  var cards = '';
  skus.forEach(function(sku) {
    var p = CATALOG.find(function(x){ return x.sku === sku; });
    if (p && p.image) {
      cards += '<div class="pcard"><img src="' + p.image + '" alt="' + p.color + '" loading="lazy" onerror="this.style.display=\'none\'"/><div class="pcard-body"><div class="pcard-color">' + p.color + ' &middot; ' + p.finish + '</div><div class="pcard-detail">' + p.detail + '</div><span class="pcard-sku">' + p.sku + '</span></div></div>';
    }
  });
  bot(md(text) + cards);
}

function bot(html) {
  var m = document.getElementById('msgs');
  var el = document.createElement('div');
  el.className = 'msg bot';
  el.innerHTML = '<div class="av">F</div><div class="bub">' + html + '</div>';
  m.appendChild(el); m.scrollTop = m.scrollHeight;
}

function userMsg(text, i64) {
  var m = document.getElementById('msgs');
  var el = document.createElement('div');
  el.className = 'msg user';
  var inner = '';
  if (i64) inner += '<img class="upimg" src="data:image/jpeg;base64,' + i64 + '" alt="upload"/>';
  if (text) inner += esc(text);
  el.innerHTML = '<div class="av">U</div><div class="bub">' + inner + '</div>';
  m.appendChild(el); m.scrollTop = m.scrollHeight;
}

function typing() {
  var m = document.getElementById('msgs');
  var id = 'ty' + Date.now();
  var el = document.createElement('div');
  el.className = 'msg bot'; el.id = id;
  el.innerHTML = '<div class="av">F</div><div class="bub"><div class="dots"><span></span><span></span><span></span></div></div>';
  m.appendChild(el); m.scrollTop = m.scrollHeight;
  return id;
}
function rmTyping(id) { var e = document.getElementById(id); if(e) e.remove(); }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function md(t) {
  return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/\n/g,'<br>');
}
